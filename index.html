<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Friends | 돈 만들기와 시장놀이</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand">🪙 MONEY <span>FRIENDS</span></div><div class="sub">돈을 만들고, 바꾸고, 돌려주는 신나는 가게</div></header><nav id="tabs" aria-label="게임 선택"></nav><section class="game"><div class="head"><div><small id="modeLabel"></small><h1 id="mission"></h1></div><div class="stars">⭐ <span id="stars">0</span></div></div><div class="progress"><div id="bar"></div></div><div id="scene"></div><div class="total"><div><small>내가 고른 돈</small><strong id="total">0원</strong></div><div><small>목표 금액</small><strong id="target">0원</strong></div></div><div class="tray" id="tray"><span class="muted">아래 화폐를 눌러 담아보세요.</span></div><h2 class="wallet-title">💼 화폐 지갑 <small>눌러서 담기</small></h2><div class="money-grid" id="money"></div><div class="actions"><button id="undo" class="secondary">↶ 한 개 빼기</button><button id="reset" class="secondary">처음부터</button><button id="check" class="primary">정답 확인 ✓</button></div><div id="feedback" role="status" aria-live="polite"></div><div class="footer"><button id="hint" class="link">💡 힌트 보기</button><button id="next" class="link">다음 미션 →</button></div></section><section class="learn"><h2>✦ 오늘 배울 돈의 비밀</h2><p id="lesson"></p></section><footer>화폐 이미지는 실제 화폐 사진이 아닌 교육용 도안입니다. 진행 기록은 이 기기에만 저장됩니다.</footer></main><script src="questions.js"></script><script src="script.js"></script></body></html>
