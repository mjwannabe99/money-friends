<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Friends | 우리 동네 시장</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><button id="home" aria-label="처음으로">🏠</button><div><strong>💰 MONEY FRIENDS</strong><small>우리 동네 시장놀이</small></div><span id="stars">⭐ 0</span></header><section id="homeScreen" class="panel hero"><div class="mascot">🛒</div><h1>내가 오늘은 가게 사장님!</h1><p>돈을 받고, 거스름돈을 돌려줘요.</p><button id="start" class="primary">🎮 시장놀이 시작</button><button id="learn" class="secondary">🪙 화폐 도감</button></section><section id="gameScreen" class="hidden"><div class="status"><span id="round"></span><div class="meter"><div id="bar"></div></div></div><div class="panel"><h2 id="heading"></h2><p id="instruction"></p><div id="items" class="items"></div><div id="transaction"></div><div id="moneyChoices"></div><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="undo" class="secondary">↩ 한 장 빼기</button><button id="reset" class="secondary">초기화</button><button id="check" class="primary">확인하기</button><button id="next" class="primary hidden">다음 손님 ➜</button></div></div></section><section id="learnScreen" class="panel hidden"><h2>🪙 화폐 도감</h2><p>우리나라에서 쓰는 동전과 지폐를 알아봐요.</p><div id="catalog"></div><button id="back" class="primary">처음으로</button></section><section id="finishScreen" class="panel hero hidden"><div class="mascot">🏆</div><h2>오늘의 시장놀이 끝!</h2><p id="summary"></p><button id="again" class="primary">한 번 더 놀기</button></section></main><script src="questions.js"></script><script src="script.js"></script></body></html>
